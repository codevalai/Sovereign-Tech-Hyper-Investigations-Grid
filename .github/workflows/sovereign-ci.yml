name: Sovereign v26.1 11-Phase Cryptographic CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sovereign-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-forensic-matrix:
    name: Typecheck, Vite Build & 11-Phase v26.1 Cryptographic CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: false

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Strict TypeScript Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Production Vite Bundle Build
        run: npm run build

      - name: Run 11-Phase Cryptographic, ACH, FtM & v26.1 Precision CI Suite
        run: npm run verify

  verify-container-build:
    name: Multi-Stage Docker Image Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Production Docker Image (node:22-bookworm-slim)
        run: docker build -t sovereign-tech-hyper-investigations-grid:ci .
