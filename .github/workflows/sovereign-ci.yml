name: Sovereign 200-Agent Cryptographic CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sovereign-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-forensic-matrix:
    name: Typecheck, Production Build, 200-Agent Seals & Live /api/health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: false

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Strict TypeScript Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Production Vite Bundle Build
        run: npm run build

      - name: Verify 200-Agent Dossier Cryptographic Seals & Ring-1/Ring-5 Defense
        run: npx tsx scripts/verify-ci.ts --require-build

      - name: Verify Node 22 Production Boot & /api/health Endpoint
        run: |
          NODE_ENV=production PORT=3000 node server.ts &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/api/health > /tmp/health.json; then
              cat /tmp/health.json
              grep -q '"status":"ok"' /tmp/health.json
              grep -q '"agents":200' /tmp/health.json
              grep -q '"version":"28.0"' /tmp/health.json
              exit 0
            fi
            sleep 0.5
          done
          echo "Health check failed on http://localhost:3000/api/health"
          exit 1

  verify-container-build:
    name: Multi-Stage Docker Image Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Production Docker Image (node:22-bookworm-slim)
        run: docker build -t sovereign-forensic-matrix:ci .
