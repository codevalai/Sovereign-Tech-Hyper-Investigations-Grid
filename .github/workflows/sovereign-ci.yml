name: Sovereign 160-Agent Cryptographic CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sovereign-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-forensic-matrix:
    name: Typecheck, Production Build & 160-Agent Cryptographic Seals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: false

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Strict TypeScript Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Production Vite Bundle Build
        run: npm run build

      - name: Verify 160-Agent Dossier Cryptographic Seals & Ring-1/Ring-5 Defense
        run: npx tsx scripts/verify-ci.ts --require-build

  verify-container-build:
    name: Multi-Stage Docker Image Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Production Docker Image (node:22-bookworm-slim)
        run: docker build -t sovereign-forensic-matrix:ci .
